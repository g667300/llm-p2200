; Model presets for the Quadro P2200 (5GB). Section names are used as the API "model" names.
; MoE experts stay in RAM (cmoe); only moe-cache-mib worth of experts is cached on the GPU.
; With 5GB, KV (context) and the cache compete for VRAM, so the larger c is, the smaller the cache.
; 200k only starts with ctv=q4_0. VRAM limit is 5046MiB (Qwen 200k uses 5.04GB, almost no headroom).
; Start with ./endpoint.sh start

version = 1

[*]
lv = 4
no-op-offload = false
no-mmproj-offload = true
cache-ram = 3072
np = 1
ngl = 99
cmoe = true
ub = 512
b = 512
ctk = q8_0
ctv = q4_0

; ---- Qwen3.6-35B-A3B (UD-IQ4_XS + mmproj) ----
[qwen3.6-35b-64k]
model = /models/qwen3.6-35b/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
mmproj = /models/qwen3.6-35b/mmproj-F16.gguf
c = 65536
moe-cache-mib = 1800

[qwen3.6-35b-200k]
model = /models/qwen3.6-35b/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
mmproj = /models/qwen3.6-35b/mmproj-F16.gguf
c = 200000
moe-cache-mib = 600

; ---- gemma-4-26B-A4B (QAT UD-Q4_K_XL + mmproj) ----
[gemma-4-26B-A4B-64k]
model = /models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26B-A4B/mmproj-F16.gguf
c = 65536
moe-cache-mib = 2100

[gemma-4-26B-A4B-200k]
model = /models/gemma-4-26B-A4B/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26B-A4B/mmproj-F16.gguf
c = 200000
moe-cache-mib = 600
